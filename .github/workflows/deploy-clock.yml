name: Deploy optional custom clock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Deploy clock Worker
        uses: cloudflare/wrangler-action@v4
        with:
          # Least privilege for this workers.dev deployment:
          # Account / Workers Scripts / Edit
          # Account / Account Settings / Read
          # Scope the token to the same single account as this account ID.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: clock-worker
